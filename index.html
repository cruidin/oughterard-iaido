<style>
  :root {
    --ink: #1b1917;
    --washi: #efe9db;
    --washi-deep: #e5ddc9;
    --indigo: #2e3b52;
    --hanko: #9c3b2e;
    --stone: #86807066;
    --stone-solid: #6b6558;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--washi);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 300;
    line-height: 1.65;
    overflow-x: hidden;
  }

  .display {
    font-family: 'Shippori Mincho', serif;
  }

  .mono {
    font-family: 'IBM Plex Mono', monospace;
  }

  a { color: inherit; }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    opacity: 0.35;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(0,0,0,0.015) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(0,0,0,0.02) 0%, transparent 45%);
  }

  .hero {
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6vh 6vw;
    position: relative;
  }

  .stroke-wrap {
    width: 4px;
    height: 18vh;
    max-height: 160px;
    margin-bottom: 2.5rem;
  }

  .stroke-path {
    stroke: var(--ink);
    stroke-width: 3;
    fill: none;
    stroke-linecap: round;
    stroke-dasharray: 300;
    stroke-dashoffset: 300;
    animation: draw 1.4s cubic-bezier(.65,0,.35,1) 0.3s forwards;
  }

  @keyframes draw {
    to { stroke-dashoffset: 0; }
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--stone-solid);
    margin-bottom: 1.1rem;
    opacity: 0;
    animation: fadeUp 0.8s ease 1.5s forwards;
  }

  h1.title {
    font-size: clamp(2.2rem, 6vw, 4.2rem);
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.08;
    opacity: 0;
    animation: fadeUp 0.9s ease 1.65s forwards;
  }

  .subtitle {
    margin-top: 1.4rem;
    font-size: clamp(1rem, 1.6vw, 1.2rem);
    color: var(--stone-solid);
    max-width: 32em;
    font-weight: 300;
    opacity: 0;
    animation: fadeUp 0.9s ease 1.85s forwards;
  }

  .hero-cta {
    margin-top: 2.6rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--indigo);
    text-decoration: none;
    border-bottom: 1px solid var(--indigo);
    padding-bottom: 0.2rem;
    opacity: 0;
    animation: fadeUp 0.9s ease 2.05s forwards;
    transition: opacity 0.2s;
  }
  .hero-cta:hover { opacity: 0.65 !important; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .divider {
    display: flex;
    justify-content: center;
    padding: 0 0 2px;
  }
  .divider svg { width: 2px; height: 60px; }
  .divider path {
    stroke: var(--stone-solid);
    stroke-width: 2;
    fill: none;
  }

  section {
    max-width: 720px;
    margin: 0 auto;
    padding: 5.5rem 6vw;
    position: relative;
    z-index: 2;
  }

  .section-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--hanko);
    margin-bottom: 1.2rem;
  }

  h2 {
    font-family: 'Shippori Mincho', serif;
    font-size: clamp(1.5rem, 3vw, 2rem);
    font-weight: 600;
    margin-bottom: 1.3rem;
    line-height: 1.3;
  }
